[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-code-review"
version = "0.1.0"
description = "OpenEnv code review simulation environment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openenv-core>=0.2.0",
    "fastapi",
    "uvicorn",
    "gradio",
    "pydantic",
    "pyyaml",
    "openai",
]

[project.scripts]
server = "server.app:main"
